name: CI

on:
  # Pushes to main are checked by publish-image.yml, which calls this workflow
  # before building, so main isn't listed here (avoids running CI twice).
  push:
    branches: [dev, 'claude/**']
  pull_request:
    branches: [main, dev]
  workflow_call:

permissions:
  contents: read

jobs:
  # The one check the rulesets require.
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Exactly what scripts/check.sh runs on the dev box: `npm run check` in the Node 22
      # container (vendored-platform check, typecheck, lint, format, tests with coverage,
      # build, audit), then the end-to-end tests against the built Docker image.
      - name: Run checks and end-to-end tests
        run: sh scripts/check.sh
