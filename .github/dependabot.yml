# Dependency updates. Every PR targets dev, never main: merging into main is a
# release, and that stays the owner's decision. Minor and patch bumps are grouped
# into one weekly PR per ecosystem; major bumps get their own PRs so they can be
# tested on their own. Security updates are off in repo settings (they always
# target main); alerts stay on.
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    target-branch: dev
    schedule:
      interval: weekly
      day: monday
    groups:
      npm-minor-patch:
        update-types: [minor, patch]
    # Node's type definitions follow the Node version the app runs on (22, see the
    # docker entry below), so their major versions aren't proposed either.
    ignore:
      - dependency-name: '@types/node'
        update-types: [version-update:semver-major]

  - package-ecosystem: github-actions
    directory: /
    target-branch: dev
    schedule:
      interval: weekly
      day: monday
    groups:
      actions-minor-patch:
        update-types: [minor, patch]

  # Node base image in the Dockerfile. Major Node versions (e.g. 22 -> 24) are a
  # deliberate choice that also touches scripts/check.sh and @types/node, so they
  # are not proposed here.
  - package-ecosystem: docker
    directory: /
    target-branch: dev
    schedule:
      interval: weekly
      day: monday
    ignore:
      - dependency-name: node
        update-types: [version-update:semver-major]
