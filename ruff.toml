# REM-OPS-01a: lint config for the CI quality gate.
# The rule list is locked explicitly, so a new ruff release can't change what CI
# enforces (ruff 0.17 widened its defaults to ~400 rules, which broke the gate).
# - E4/E7/E9/F: the original pyflakes + pycodestyle-error set this project chose.
# - The six codes after it were fixed once and are kept so they stay fixed.
# Widening further (import sorting, bugbear, pyupgrade, `ruff format`) is still
# REM-MAINT-06: do it as its own change, by adding codes here.
# ruff itself is pinned in requirements-dev.txt; Dependabot raises it into dev.
target-version = "py312"
line-length = 100

[lint]
select = [
    "E4", "E7", "E9", "F",
    "I001",    # import order
    "BLE001",  # blind `except Exception` (deliberate ones carry a noqa with the reason)
    "PIE810",  # repeated startswith/endswith
    "ISC004",  # implicit string concatenation inside a collection
    "UP031",   # %-formatting
    "SIM117",  # nested `with` statements
]
